    <title>Coming Soon</title>

    <style>
        /* Add this style to your existing CSS */
    
        .background-wrapper {
            position: relative;
            width: 100%;
            height: 100vh; /* Makes the background cover the whole screen */
            background-image: url('img/photo/coming-soon-bg.jpg');
            background-size: cover; /* Ensures the image covers the area */
            background-position: center; /* Centers the image */
            background-repeat: no-repeat; /* Prevents the image from repeating */
        }

        .background-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5); /* White with some transparency */
            filter: blur(10px); /* Adds blur */
            z-index: 1; /* Places the blur above the background */
        }

        .background-wrapper .bg-transfer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Makes sure the image stays below the blur layer */
        }
    </style>
</head>
